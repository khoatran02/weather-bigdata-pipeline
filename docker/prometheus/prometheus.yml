global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
  - job_name: influxdb
    static_configs: [{ targets: ["influxdb:8086"] }]
  - job_name: seaweedfs
    static_configs: [{ targets: ["seaweedfs:9327"] }]
  - job_name: spark-master
    metrics_path: /metrics/master/prometheus
    static_configs: [{ targets: ["spark-master:8080"] }]
  - job_name: spark-workers
    metrics_path: /metrics/prometheus
    static_configs: [{ targets: ["spark-worker-1:8081", "spark-worker-2:8081"] }]
