apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData: { version: Flux, organization: ktxldll, defaultBucket: weather_live }
    secureJsonData: { token: $INFLUX_TOKEN }
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
