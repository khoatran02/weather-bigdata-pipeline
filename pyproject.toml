[project]
name = "weather-bigdata-pipeline"
version = "1.0.0"
description = "Kappa-style weather lakehouse: Kafka, Spark, Delta Lake, InfluxDB, Grafana"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
