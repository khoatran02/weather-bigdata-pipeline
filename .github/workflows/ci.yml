name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: python3 scripts/init_env.py && docker compose config --quiet
      - name: Lint and unit tests
        run: make test
